# Included in every location: nginx drops server-level add_header when a location sets its own.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
# Content Security Policy. __API_ORIGIN__ is replaced at image build time with the API's origin
# (empty when the API is same-origin). Signed URLs (uploads and previews) are on
# storage.googleapis.com; Firebase Auth calls identitytoolkit/securetoken and may frame the
# project's auth domain. Inline styles are needed by the charts library (style attributes).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://storage.googleapis.com; font-src 'self' data:; connect-src 'self' __API_ORIGIN__ https://storage.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; frame-src https://storage.googleapis.com https://*.firebaseapp.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
