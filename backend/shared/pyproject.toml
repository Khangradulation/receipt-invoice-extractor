[project]
name = "receipt-shared"
version = "0.1.0"
description = "Shared configuration, logging and domain models for the receipt extractor services"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "starlette>=0.41",
]

[project.optional-dependencies]
# Gemini extraction engine (used by the worker, the evaluation suite and the CLI).
extraction = [
    "google-genai>=1.0",
    "pypdf>=5.0",
    "pillow>=11.0",
]

# Cloud Storage + Firestore clients (API and worker).
gcp = [
    "google-cloud-storage>=2.18",
    "google-cloud-firestore>=2.19",
    "google-cloud-bigquery>=3.27",
]

[project.scripts]
receipt-extract = "receipt_shared.extraction.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/receipt_shared"]
