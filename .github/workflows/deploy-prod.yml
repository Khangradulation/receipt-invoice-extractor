# Production release: push a version tag (git tag v1.2.0 && git push origin v1.2.0).
# Runs CI, then one job in the protected "production" GitHub environment (required reviewers,
# tag-only deployment rule) that applies Terraform, builds versioned images, deploys them and
# smoke-tests. Only jobs in that environment can obtain production credentials (WIF, no keys).
#
# Configuration (GitHub → Settings → Environments → production → Variables; none are secrets):
#   GCP_PROJECT_ID, GCP_PROJECT_NUMBER, GCP_REGION, GCP_WIF_PROVIDER, GCP_DEPLOYER_SA,
#   GCP_TERRAFORM_SA, TF_STATE_BUCKET, GCP_BILLING_ACCOUNT, BUDGET_AMOUNT,
#   VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_APP_ID
#   Optional: WEB_ORIGINS, AUTH_DOMAINS, NOTIFICATION_CHANNELS (HCL lists, e.g. ["https://x"])
name: Deploy prod

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Terraform, build, deploy, smoke-test
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: https://receipt-frontend-${{ vars.GCP_PROJECT_NUMBER }}.${{ vars.GCP_REGION }}.run.app
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ github.ref_name }}
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/receipt-extractor
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_project_number: ${{ vars.GCP_PROJECT_NUMBER }}
      TF_VAR_region: ${{ vars.GCP_REGION }}
      TF_VAR_billing_account: ${{ vars.GCP_BILLING_ACCOUNT }}
      TF_VAR_budget_amount: ${{ vars.BUDGET_AMOUNT }}
      TF_VAR_github_repository: ${{ github.repository }}
      TF_VAR_web_origins: ${{ vars.WEB_ORIGINS || '[]' }}
      TF_VAR_auth_domains: ${{ vars.AUTH_DOMAINS || '[]' }}
      TF_VAR_notification_channels: ${{ vars.NOTIFICATION_CHANNELS || '[]' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 1) Infrastructure, as the Terraform runner account.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SA }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false
      - name: Terraform plan
        working-directory: terraform/environments/prod
        run: |
          terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          terraform plan -out=tfplan
      - name: Terraform apply (the plan above)
        working-directory: terraform/environments/prod
        run: terraform apply tfplan

      # 2) Images and deploy, as the (less privileged) deployer account.
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          token_format: access_token
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push versioned images
        env:
          VITE_API_BASE_URL: https://receipt-api-${{ vars.GCP_PROJECT_NUMBER }}.${{ vars.GCP_REGION }}.run.app
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: |
          docker buildx build --push -f backend/api/Dockerfile -t "${REGISTRY}/api:${VERSION}" backend
          docker buildx build --push -f backend/worker/Dockerfile -t "${REGISTRY}/worker:${VERSION}" backend
          docker buildx build --push -f frontend/Dockerfile -t "${REGISTRY}/frontend:${VERSION}" \
            --build-arg VITE_API_BASE_URL --build-arg VITE_FIREBASE_API_KEY \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN --build-arg VITE_FIREBASE_APP_ID \
            --build-arg "VITE_FIREBASE_PROJECT_ID=${PROJECT_ID}" frontend
      - name: Deploy
        run: |
          for svc in worker api frontend; do
            gcloud run deploy "receipt-${svc}" --project "$PROJECT_ID" --region "$REGION" \
              --image "${REGISTRY}/${svc}:${VERSION}" --quiet
          done
      - name: Smoke test
        run: EXPECT_TAG="$VERSION" PROJECT_NUMBER="${{ vars.GCP_PROJECT_NUMBER }}" ./ops/ci/smoke-test.sh
