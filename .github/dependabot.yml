# Weekly dependency update PRs. Each PR runs the full CI (tests, audits, builds) before merge.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/backend/api, /backend/worker, /frontend]
    schedule: { interval: weekly }

  - package-ecosystem: terraform
    directories: [/terraform/environments/dev, /terraform/environments/prod]
    schedule: { interval: weekly }
