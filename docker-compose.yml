# Production-like local stack built from the same Dockerfiles that Cloud Run uses.
#   docker compose up --build
# Frontend: http://localhost:5173  API: http://localhost:8080/api/v1/docs  Worker: http://localhost:8081/health
#
# For day-to-day development with hot reload, run the services natively instead (see docs/setup.md).
# Emulators (Firestore, Firebase Auth) are added to this file in later phases.

x-backend-env: &backend-env
  ENVIRONMENT: local
  PORT: "8080"

services:
  api:
    build:
      context: ./backend
      dockerfile: api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      <<: *backend-env
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: ./backend
      dockerfile: worker/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      <<: *backend-env
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        # The browser calls the API directly on the host port (CORS allows :5173).
        VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:8080"
    depends_on:
      api:
        condition: service_healthy
